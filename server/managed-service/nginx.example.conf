# REVIEW FRAGMENT ONLY. Do not replace an existing server with this file.
# No reload/install command is provided. Retain your existing TLS, exact DAV
# prefix transformation, body limits, security headers and FIXED DROP handler.
# Requires ngx_http_auth_request_module. Test nginx -t and the deployment matrix.
# The example assumes DAV is bound to private 127.0.0.1:8090 and managed service
# is bound to 127.0.0.1:8089. Their real listen/firewall settings must be verified.

# Inside the existing TLS server{}:
location = /_internal/dav-authorize {
    internal;
    proxy_pass http://127.0.0.1:8089/_internal/dav-authorize;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Transfer-Encoding "";
    proxy_set_header Expect "";
    proxy_set_header Host 127.0.0.1:8089;
    # This variable is captured in each PARENT managed location, before the
    # auth subrequest changes method. Client headers never supply its value.
    proxy_set_header X-Original-Method $managed_original_method;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-User "";
    proxy_set_header X-Account-ID "";
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 50s;
}

location = /api/register {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8089/api/register;
    proxy_set_header Host 127.0.0.1:8089;
    proxy_set_header X-Original-Method "";
    proxy_set_header X-User "";
    proxy_set_header X-Account-ID "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 50s;
}

location = /api/account/entitlement {
    proxy_pass http://127.0.0.1:8089/api/account/entitlement;
    proxy_set_header Host 127.0.0.1:8089;
    proxy_set_header X-Original-Method "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-User "";
    proxy_set_header X-Account-ID "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 50s;
}

# Do not send /api/v2/*, /web/client/*, /register, or other old management/login
# endpoints to SFTPGo through the root DAV alias. Enumerate other exact public
# application routes separately, keeping their existing access controls.
location ^~ /api/ { return 404; }
location ^~ /web/ { return 404; }
location = /register { return 404; }
location = /healthz { return 404; }

# REQUIRED REVIEW POINT: retain the EXISTING fixed-drop handler and its exact
# and slash-prefixed /upload routes HERE. Its distinct trusted fixed identity
# and bounded destination cannot accept managed credentials or become a general
# DAV proxy. Do not add auth_request to a proven exempt drop. This fragment
# intentionally contains NO replacement handler or directive for /upload.
# Do not use this fragment until both existing isolated locations are retained;
# otherwise the root managed DAV location below would capture /upload.
# Existing deployment must contain: location = /upload { <existing handler> }
# and location ^~ /upload/ { <existing isolated handler or rejection> }.

# Every alias into the managed user's storage needs this gate. Preserve the
# existing URI mapping: this example removes /dav/ for a DAV root backend.
location = /dav {
    set $managed_original_method $request_method;
    auth_request /_internal/dav-authorize;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-Method "";
    proxy_pass http://127.0.0.1:8090/;
}
location ^~ /dav/ {
    set $managed_original_method $request_method;
    auth_request /_internal/dav-authorize;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-Method "";
    proxy_pass http://127.0.0.1:8090/;
}
location / {
    set $managed_original_method $request_method;
    auth_request /_internal/dav-authorize;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-Method "";
    proxy_pass http://127.0.0.1:8090;
}
# Never use error_page to turn a gate 401/403/5xx into a success or an ungated
# retry. Restrict DAV proxy destinations and alternate listeners separately.
