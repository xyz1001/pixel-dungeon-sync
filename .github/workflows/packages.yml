name: Test and package
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            python3 tools/ci/version.py --tag "$REF_NAME"
          else
            python3 tools/ci/version.py
          fi
          python3 -m unittest discover -s tools/ci -p 'test_*.py'

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PDSYNC_BUILD_HOME: ${{ github.workspace }}/../android-inputs
      PDSYNC_BRIDGE_RUNTIME_DEX: ${{ github.workspace }}/../android-inputs/bridge-runtime.dex
      PDSYNC_ROOT_NATIVE_DIR: ${{ github.workspace }}/../android-inputs/root-native
      PDSYNC_APKSIG_JAR: ${{ github.workspace }}/../android-inputs/apksigner-api26.jar
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned SDK components
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-26' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Build bridge DEX, native libraries and API26 signing library
        run: python3 tools/ci/android-inputs.py
      - name: Android host regressions
        run: |
          python3 -m unittest discover -s android-app/src/test/python -p 'test_*.py'
          python3 -m unittest discover -s tools/android-rebuild/tests -p 'test_*.py'
          bash tools/android-root-native/test-host.sh
          bash tools/android-rebuild/test-helper-host.sh
      - name: Release APK and lint
        run: bash gradlew --no-daemon :android-app:assembleRelease :android-app:lintRelease
      - name: Check unsigned APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android-app/build/outputs/apk/release/android-app-release-unsigned.apk
          mkdir -p dist
          cp android-app/build/outputs/apk/release/android-app-release-unsigned.apk dist/PDSync-android-unsigned.apk
          cp "$PDSYNC_BUILD_HOME/native-report.json" dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-test-reports
          path: android-app/build/reports/
          retention-days: 14

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Windows WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:WIX\bin" >> $env:GITHUB_PATH
          & "$env:WIX\bin\candle.exe" -?
      - name: Linux display prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 fakeroot fontconfig fonts-noto-cjk
          fc-match 'sans:lang=zh-cn'
          fc-list :lang=zh family | sort -u
      - name: JVM and shared UI regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pdsync-tests"
          TEST_TEMP=$(python -c 'import os,pathlib;print((pathlib.Path(os.environ["RUNNER_TEMP"])/"pdsync-tests").resolve())')
          export TMPDIR="$TEST_TEMP"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$TEST_TEMP"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a bash gradlew --no-daemon --continue :core:test :desktop:test
          else
            bash gradlew --no-daemon --continue :core:test :desktop:test
          fi
      - name: Native installers and bundled runtime
        id: package
        if: ${{ !cancelled() }}
        shell: bash
        run: bash gradlew --no-daemon :desktop:createDistributable :desktop:packageDistributionForCurrentOS
      - name: Native app-image smoke and package inspection
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python tools/ci/desktop-package.py
      - name: Real pacman package and installation smoke
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.package.outcome == 'success' }}
        run: bash tools/ci/pacman.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Collect synthetic render evidence
        if: always()
        run: python tools/ci/collect-test-evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.platform }}
          path: |
            core/build/reports/tests/
            desktop/build/reports/tests/
            build/ci-render-evidence/
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: android-unsigned
          path: dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Sign APK, verify all six artifacts, publish only complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PDSYNC_KEYSTORE_BASE64: ${{ secrets.PDSYNC_KEYSTORE_BASE64 }}
          PDSYNC_KEY_ALIAS: ${{ secrets.PDSYNC_KEY_ALIAS }}
          PDSYNC_STORE_PASSWORD: ${{ secrets.PDSYNC_STORE_PASSWORD }}
          PDSYNC_KEY_PASSWORD: ${{ secrets.PDSYNC_KEY_PASSWORD }}
        run: python3 tools/ci/release.py
