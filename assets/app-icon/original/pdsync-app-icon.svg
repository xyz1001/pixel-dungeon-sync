<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- M3 Forest Green Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14462b" />
      <stop offset="50%" stop-color="#0f3420" />
      <stop offset="100%" stop-color="#071b11" />
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <radialGradient id="rimGlow" cx="256" cy="180" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </radialGradient>

    <!-- Sync Glow Gradient -->
    <linearGradient id="syncGlow" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sync Arrow Glow Filter -->
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- M3 Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#rimGlow)" />
  <rect x="33.5" y="33.5" width="445" height="445" rx="98.5" ry="98.5" stroke="#6ee7b7" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Outer Luminous Sync Arrows (Orbit Radius 192, COMPLETELY OUTSIDE THE CHEST) -->
  <g filter="url(#arrowGlow)" opacity="0.95">
    <!-- Top-Right Sweep & Connected Arrowhead -->
    <path d="M 81.4 176.2 A 192 192 0 0 1 447.9 251.5" stroke="url(#syncGlow)" stroke-width="14" stroke-linecap="round" fill="none" />
    <polygon points="447.9,279.5 466.9,241.5 428.9,241.5" fill="#67e8f9" />

    <!-- Bottom-Left Sweep & Connected Arrowhead -->
    <path d="M 430.5 336.0 A 192 192 0 0 1 64.0 260.1" stroke="url(#syncGlow)" stroke-width="14" stroke-linecap="round" fill="none" />
    <polygon points="64.0,232.1 45.0,270.1 83.0,270.1" fill="#67e8f9" />
  </g>

  <!-- Authentic Original Shattered Pixel Dungeon Chest -->
  <ellipse cx="256" cy="366" rx="105" ry="14" fill="#000000" opacity="0.45" />
  <image href="data:image/png;base64," x="139" y="143" width="235" height="227" style="image-rendering: pixelated;" />
</svg>